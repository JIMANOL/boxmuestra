<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club de Box & Kickboxing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <div id="header-placeholder"></div>

    <section class="relative min-h-[85vh] flex items-center justify-center text-center px-4 py-16 bg-gradient-to-b from-slate-900 via-slate-950 to-slate-950">
        <div class="max-w-3xl mx-auto space-y-6">
            <span class="inline-block px-3 py-1 bg-red-500/10 text-red-400 border border-red-500/20 rounded-full text-xs sm:text-sm font-semibold tracking-wide uppercase">
                Entrena    |    Aprende    |    Supérate
            </span>
            
            <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white leading-tight">
                Forja tu disciplina, <br class="hidden sm:inline"/>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500">
                    supera tus límites
                </span>
            </h1>

            <p class="text-slate-400 text-base sm:text-lg max-w-xl mx-auto leading-relaxed">
                Clases de Boxeo, Kickboxing y Entrenamiento Funcional para todos los niveles.
            </p>

            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center pt-4">
                <div class="whatsapp-btn-placeholder w-full sm:w-auto" 
                     data-texto="Agendar Clase Gratis" 
                     data-mensaje="Hola, quiero agendar mi clase de prueba gratis" 
                     data-clases="w-full sm:w-auto px-8 py-4 rounded-xl shadow-xl shadow-emerald-900/30 text-base">
                </div>

                <a href="disciplinas.html" 
                   class="w-full sm:w-auto px-8 py-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl border border-slate-700 transition-all text-center">
                    Ver Disciplinas
                </a>
            </div>
            
            <div class="flex items-center justify-center w-full">
                <a href="nosotros.html" 
                    class="w-full sm:w-auto px-8 py-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl border border-slate-700 transition-all text-center">
                    Acerca de Nosotros 
                </a>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="componentes.js"></script>
</body>
</html>
